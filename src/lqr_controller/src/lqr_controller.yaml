lqr_controller:
  joints: {
    type: string_array,
    default_value: [],
    description: "Specifies joints used by the controller. If state joints parameter is defined, then only command joints are defined with this parameter.",
    read_only: true,
    validation: {
      unique<>: null,
      not_empty<>: null,
    }
  }
  state_joints: {
    type: string_array,
    default_value: [],
    description: "(optional) Specifies joints for reading states. This parameter is only relevant when state joints are different then command joint, i.e., when a following controller is used.",
    read_only: true,
    validation: {
      unique<>: null,
    }
  }
  interface_name: {
    type: string,
    default_value: "",
    description: "Name of the interface used by the controller on joints and command_joints.",
    read_only: true,
    validation: {
      not_empty<>: null,
      one_of<>: [["position", "velocity", "acceleration", "effort",]],
      forbidden_interface_name_prefix: null
    }
  }
  cmd_vel_topic: {
    type: string,
    default_value: "/cmd_vel_safe",
    description: "Topic providing safe Twist commands for the balance controller.",
    read_only: true,
    validation: {
      not_empty<>: null,
    }
  }
  wheel_radius: {
    type: double,
    default_value: 0.1,
    description: "Wheel radius used for velocity tracking in meters.",
    read_only: true,
  }
  k_yaw: {
    type: double,
    default_value: 1.0,
    description: "Yaw-rate feedback gain used to convert angular velocity commands into wheel effort differentials.",
    read_only: true,
  }
  max_linear_speed: {
    type: double,
    default_value: 0.18,
    description: "Maximum commanded forward speed accepted from the navigation stack in m/s.",
    read_only: true,
  }
  max_reverse_speed: {
    type: double,
    default_value: 0.08,
    description: "Maximum commanded reverse speed magnitude accepted from the navigation stack in m/s.",
    read_only: true,
  }
  max_angular_speed: {
    type: double,
    default_value: 0.6,
    description: "Maximum commanded yaw rate accepted from the navigation stack in rad/s.",
    read_only: true,
  }
  max_effort: {
    type: double,
    default_value: 1.0,
    description: "Symmetric effort clamp applied before writing commands to ros2_control.",
    read_only: true,
  }
  command_timeout: {
    type: double,
    default_value: 0.5,
    description: "Maximum age in seconds for a Twist command before it is treated as zero.",
    read_only: true,
  }
  max_pitch_for_motion_deg: {
    type: double,
    default_value: 20.0,
    description: "If the robot pitch magnitude exceeds this threshold, motion commands are discarded until balance is recovered.",
    read_only: true,
  }
