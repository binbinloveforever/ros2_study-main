controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true
    robot_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      use_sim_time: true

    lqr_effort_controller:
      type: lqr_controller/LqrController

lqr_effort_controller:
  ros__parameters:
    joints:
      - left_wheel_joint
      - right_wheel_joint
    interface_name: effort
    cmd_vel_topic: /cmd_vel_safe
    wheel_radius: 0.1
    k_yaw: 1.0
    max_linear_speed: 0.18
    max_reverse_speed: 0.08
    max_angular_speed: 0.6
    max_effort: 5.0
    command_timeout: 0.5
    max_pitch_for_motion_deg: 20.0
    


